<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Record a Sale</title>
<style>
  :root { --brand: #128C7E; --brand-dark: #075E54; --bg: #f5f6f7; --text: #1c1e21; --line: #dfe3e6; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 8px 0 20px; color: var(--brand-dark); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #555; }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; margin-bottom: 14px; }
  .item-row { display: grid; grid-template-columns: 1fr 60px 90px 32px; gap: 8px; align-items: center; margin-bottom: 10px; }
  .item-row input { margin-bottom: 0; }
  .remove-btn { background: none; border: none; color: #c0392b; font-size: 18px; cursor: pointer; }
  .add-item { background: none; border: 1px dashed var(--brand); color: var(--brand-dark); padding: 8px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 14px; margin-bottom: 6px; }
  .total { text-align: right; font-weight: 700; font-size: 16px; margin: 10px 0 4px; }
  button.submit { width: 100%; background: var(--brand); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button.submit:disabled { opacity: 0.6; }
  .status { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  .status.success { display: block; background: #e8f8f0; color: #0a6b3d; border: 1px solid #b6ecd4; }
  .status.error { display: block; background: #fdecea; color: #a12a1f; border: 1px solid #f5c6c2; }
  .status.pending { display: block; background: #fff8e1; color: #8a6d00; border: 1px solid #ffe58a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Record a sale → auto-send WhatsApp receipt</h1>

  <form id="saleForm">
    <div class="card">
      <label>Customer name</label>
      <input type="text" id="customerName" placeholder="Ada Lovelace" required />

      <label>Customer WhatsApp number (with country code)</label>
      <input type="tel" id="customerPhone" placeholder="2348012345678" required />

      <label>Payment method</label>
      <select id="paymentMethod">
        <option value="cash">Cash</option>
        <option value="bank_transfer">Bank Transfer</option>
      </select>
    </div>

    <div class="card">
      <label style="margin-bottom:10px;">Items</label>
      <div id="itemsContainer"></div>
      <button type="button" class="add-item" id="addItemBtn">+ Add item</button>
      <div class="total" id="totalDisplay">Total: 0.00</div>
    </div>

    <button type="submit" class="submit" id="submitBtn">Mark as Paid & Send Receipt</button>
    <div class="status" id="statusBox"></div>
  </form>
</div>

<script>
  const itemsContainer = document.getElementById('itemsContainer');
  const totalDisplay = document.getElementById('totalDisplay');

  function addItemRow(name = '', qty = 1, price = '') {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <input type="text" placeholder="Item name" class="item-name" value="${name}" required />
      <input type="number" placeholder="Qty" class="item-qty" min="1" value="${qty}" required />
      <input type="number" placeholder="Price" class="item-price" min="0" step="0.01" value="${price}" required />
      <button type="button" class="remove-btn">&times;</button>
    `;
    row.querySelector('.remove-btn').addEventListener('click', () => {
      row.remove();
      updateTotal();
    });
    row.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotal));
    itemsContainer.appendChild(row);
  }

  function updateTotal() {
    let total = 0;
    document.querySelectorAll('.item-row').forEach(row => {
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const price = parseFloat(row.querySelector('.item-price').value) || 0;
      total += qty * price;
    });
    totalDisplay.textContent = `Total: ${total.toFixed(2)}`;
  }

  document.getElementById('addItemBtn').addEventListener('click', () => addItemRow());
  addItemRow(); // start with one row

  document.getElementById('saleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    const items = Array.from(document.querySelectorAll('.item-row')).map(row => ({
      name: row.querySelector('.item-name').value,
      qty: parseFloat(row.querySelector('.item-qty').value),
      price: parseFloat(row.querySelector('.item-price').value),
    }));

    const payload = {
      customerName: document.getElementById('customerName').value,
      customerPhone: document.getElementById('customerPhone').value,
      paymentMethod: document.getElementById('paymentMethod').value,
      items,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    statusBox.className = 'status pending';
    statusBox.textContent = 'Generating receipt and sending on WhatsApp...';

    try {
      const res = await fetch('/api/sale', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (data.sent) {
        statusBox.className = 'status success';
        statusBox.textContent = `✅ Receipt ${data.sale.id} sent to ${data.sale.customerPhone} on WhatsApp.`;
        e.target.reset();
        itemsContainer.innerHTML = '';
        addItemRow();
        updateTotal();
      } else {
        statusBox.className = 'status error';
        statusBox.textContent = `Receipt generated but WhatsApp send failed: ${JSON.stringify(data.error || 'Unknown error')}`;
      }
    } catch (err) {
      statusBox.className = 'status error';
      statusBox.textContent = 'Something went wrong: ' + err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Mark as Paid & Send Receipt';
    }
  });
</script>
</body>
</html>
